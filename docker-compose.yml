services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: hoteldb
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    ports:
      - "5010:5000"
    environment:
      - ConnectionStrings__HotelDB=Host=db;Port=5432;Database=hoteldb;Username=postgres;Password=postgrespassword
      - ASPNETCORE_ENVIRONMENT=Development
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  appadmin:
    build:
      context: .
      dockerfile: Dockerfile
      target: appadmin
    ports:
      - "4434:4434"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
    depends_on:
      - api
    restart: unless-stopped

volumes:
  postgres-data:
